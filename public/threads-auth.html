<!doctype html>
<!--
  Threads session capture.

  Served by the app at /api/threads-auth?t=TOKEN. Opened in the browser that is
  ALREADY logged into Threads. It reads the Threads cookies, POSTs them to the
  app, and reports the outcome. No password ever crosses this page; the cookie
  is sent once, over the same origin that issued the token, and the token is
  burned server-side on first use.
-->
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threads capture</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0b0d10; color: #e6e8eb;
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card { width: 100%; max-width: 460px; background: #14171c; border: 1px solid #232830; border-radius: 14px; padding: 22px; }
  h1 { margin: 0 0 4px; font-size: 18px; }
  p.sub { margin: 0 0 18px; color: #98a2b3; font-size: 13px; }
  button {
    width: 100%; padding: 12px 14px; border: 0; border-radius: 10px;
    background: #4f7cff; color: #fff; font-weight: 650; font-size: 15px; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  .note { margin: 14px 0 0; font-size: 12.5px; color: #98a2b3; }
  .out { margin: 16px 0 0; padding: 12px; border-radius: 10px; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  .out.hidden { display: none; }
  .out.ok { background: #10281a; color: #7ee2a8; border: 1px solid #1d4a30; }
  .out.err { background: #2a1414; color: #f2a2a2; border: 1px solid #4a1d1d; }
  .out.busy { background: #16202e; color: #a9c4f2; border: 1px solid #22344d; }
  .found { margin: 0 0 14px; padding: 10px 12px; border-radius: 10px; background: #0f1319; border: 1px solid #232830; font-size: 12.5px; color: #98a2b3; }
  .found b { color: #e6e8eb; font-weight: 600; }
</style>
</head>
<body>
<main class="card">
  <h1>Threads session capture</h1>
  <p class="sub">Hubungkan Threads ke aplikasi affiliate tanpa kirim password.</p>

  <div class="found" id="probe">Memeriksa cookie Threads di browser ini…</div>

  <button id="go" disabled>Menangkap sesi Threads</button>

  <pre class="out hidden" id="out" role="status" aria-live="polite"></pre>

  <p class="note">Cookie hanya terbaca untuk domain Threads dan dikirim satu kali ke server yang menerbitkan link ini. Setelah itu token mati.</p>
</main>

<script>
  const TOKEN = new URLSearchParams(location.search).get("t");
  const btn = document.getElementById("go");
  const out = document.getElementById("out");
  const probe = document.getElementById("probe");

  function show(kind, text) {
    out.className = "out " + kind;
    out.textContent = text;
    out.classList.remove("hidden");
  }

  // HttpOnly cookies are NOT readable here. What we can read is still enough to
  // have a usable session id, but we must be honest about which names arrived.
  function readCookies() {
    const names = ["sessionid", "csrftoken", "ds_user_id", "rur", "mid"];
    const found = [];
    for (const n of names) {
      const m = document.cookie.match(new RegExp("(?:^|; )" + n + "=([^;]*)"));
      if (m) found.push({ name: n, value: decodeURIComponent(m[1]) });
    }
    return found;
  }

  const cookies = readCookies();
  if (!cookies.length) {
    probe.innerHTML = "Tidak ada cookie Threads di browser ini.";
    show("err",
      "Belum login Threads di browser ini.\n\n" +
      "1. Buka tab baru → https://www.threads.com dan login.\n" +
      "2. Balik ke halaman ini, muat ulang.\n" +
      "3. Klik tombol di atas.");
  } else {
    const names = cookies.map((c) => c.name).join(", ");
    probe.innerHTML = "Cookie Threads terbaca: <b>" + names + "</b>";
    btn.disabled = false;
  }

  if (!TOKEN) {
    show("err", "Token tidak ada di URL. Buat link capture baru dari halaman Sosmed.");
  }

  btn.addEventListener("click", async () => {
    btn.disabled = true;
    show("busy", "Mengirim cookie ke server…");

    let payload;
    try {
      payload = {
        token: TOKEN,
        capturedAt: new Date().toISOString(),
        cookies: cookies.map((c) => ({
          name: c.name,
          value: c.value,
          domain: "threads.com",
          path: "/",
          secure: true,
          httpOnly: false,
          sameSite: "Lax",
        })),
      };
    } catch (e) {
      show("err", "Gagal menyiapkan data: " + e.message);
      return;
    }

    try {
      const res = await fetch("/api/threads-auth/capture", {
        method: "POST",
        headers: { "content-type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify(payload),
      });
      const text = await res.text();
      let body;
      try { body = JSON.parse(text); } catch { body = { raw: text }; }
      if (!res.ok) {
        show("err", "Server menolak (" + res.status + "):\n" + (body.error || text));
        btn.disabled = false;
        return;
      }
      show("ok",
        "Sesi tertangkap.\n\n" +
        JSON.stringify(body, null, 2) +
        "\n\nBalik ke halaman Sosmed → tag Threads harus berubah jadi LIVE.");
    } catch (e) {
      show("err", "Gagal mengirim: " + e.message + "\n\nPeriksa koneksi lalu coba lagi.");
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
